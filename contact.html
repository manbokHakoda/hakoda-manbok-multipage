  <meta charset="UTF-8">

</head>

<body>

<header class="site-header">
  <div class="container nav-container">

    <a href="index.html" class="logo">箱田満福</a>

    <button class="menu-toggle" aria-label="メニューを開く">☰</button>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="roots.html">Roots</a>
      <a href="mongolia.html">Монгол</a>
      <a href="japan-mongolia.html">日本–モンゴル</a>
      <a href="family.html">Family</a>
      <a href="purewater.html">Pure Water</a>
      <a href="essay.html">感想文</a>
      <a href="future.html">Future</a>
      <a href="gallery.html">Gallery</a>
      <a href="sources.html">Sources</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

  </div>
</header>

<main>

<section class="page-hero">
  <div class="container">
    <p class="eyebrow">CONTACT</p>
    <h1>お問い合わせ</h1>
    <p>ご質問・ご感想などをお送りください。</p>
  </div>
</section>

<section class="section">

  <div class="container contact-grid">

    <div>
      <p class="eyebrow">GET IN TOUCH</p>

      <h2>お問い合わせ</h2>

      <p>
        日本とモンゴルの歴史、
        家族史、Pure Waterなどについて
        ご連絡いただけます。
      </p>

      <div class="contact-info">
        <div>
          <strong>Email</strong>
          <p>
            manbokhakoda1020@gmail.com
          </p>
        </div>

        <div>
          <strong>Theme</strong>
          <p>
            Japan × Mongolia × Pure Water
          </p>
        </div>
      </div>
    </div>

    <form
      class="contact-form"
      action="mailto:manbokhakoda1020@gmail.com"
      method="post"
      enctype="text/plain"
    >

      <label for="name">お名前</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="お名前"
        required
      >

      <label for="email">メールアドレス</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="example@email.com"
        required
      >

      <label for="message">メッセージ</label>
      <textarea
        id="message"
        name="message"
        rows="7"
        placeholder="お問い合わせ内容"
        required
      ></textarea>

      <button type="submit" class="btn">
        メールを送信
      </button>

    </form>

  </div>

</section>

</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span class="current-year"></span> 箱田満福</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
